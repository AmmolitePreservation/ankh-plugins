# Every game under games and every fixture game under fixtureRoot builds and runs its tests on each pull request to main
# and each push to main, and what would be released is reported: the games and the kit whose release files changed.
# A push to main also publishes those as GitHub releases.
name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - core/**
      - plugins/**
      - games/**
      - fixtureRoot/**
      - python/**
      - cmake/**
      - kit/**
      - LICENSE
      - CMakeLists.txt
      - build.ps1
      - layout.ps1
      - package.ps1
      - release.ps1
      - pyproject.toml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      # A release is created with the run's own token.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # cmd starts each script in a PowerShell process of its own: run inside a powershell step, Windows PowerShell
      # would turn the compiler's and pip's stderr into errors.
      - name: Test environment
        shell: cmd
        run: |
          python -m venv .venv || exit /b 1
          .venv\Scripts\python.exe -m pip install -e .

      # release.ps1 reads each newest release to tell what changed, which takes the token.
      - name: Build, test and report what changed
        if: github.event_name == 'pull_request'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File release.ps1 -test

      - name: Build, test and release what changed
        if: github.event_name == 'push'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File release.ps1 -test -publish
