# Balatro (LocalThunk, LOVE 11.5 on SDL2 and OpenGL), Steam app 2379780.
# The game's executable, relative to its install folder. The loader DLL and the ankh-plugins folder go beside it.
executable=Balatro.exe
# The executable's architecture, x64 or x86, which picks the build.
architecture=x64
# The system DLL the game loads at start, which the loader stands in for (core/loader/proxies lists the choices):
# Balatro.exe does not import version.dll, but its SDL2.dll does.
loader=version
