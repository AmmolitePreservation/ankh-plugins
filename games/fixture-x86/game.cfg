# The loader's test game (x86): the build makes its executable, and build.ps1 -test runs the loader in it.
# The game's executable, relative to its install folder. The loader DLL and the ankh-plugins folder go beside it.
executable=fixtureGame.exe
# The executable's architecture, x64 or x86, which picks the build.
architecture=x86
# The system DLL the executable imports, which the loader is built as (core/loader/proxies lists the choices).
loader=version
