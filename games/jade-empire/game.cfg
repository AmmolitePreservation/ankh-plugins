# Jade Empire: Special Edition (BioWare, ported by LTI Gray Matter; Direct3D 9), Steam app 7110.
# The game's executable, relative to its install folder. The loader DLL and the ankh-plugins folder go beside it.
executable=JadeEmpire.exe
# The executable's architecture, x64 or x86, which picks the build.
architecture=x86
# The system DLL the executable imports, which the loader stands in for (core/loader/proxies lists the choices).
loader=version
# The launcher's Play runs the configuration program, which checks for Steam before it starts the game.
companion=JadeEmpireConfig.exe
# Steam's Play starts this launcher, which does not load the loader; launcher-skip (msimg32.dll) starts the game instead.
launcher=JadeEmpireLauncher.exe
