# display-guard settings. A setting missing here is added with its default when the game starts, and one
# this release does not use is removed and noted in the log. Delete the file to start over.

# The monitor the game covers: primary, or a display name as Windows lists it, such as DISPLAY2.
monitor=primary

# The size the game renders at: native is the monitor's own size, game is the size the game asks for, scaled
# to the monitor with its shape kept and black bars filling the rest.
renderResolution=native

# true starts the game minimized, without taking the foreground. Otherwise a game that asked for fullscreen comes
# to the front once, when its window first shows, unless the program that started it asked for no activation.
startMinimized=false

# true keeps the game from taking the keyboard and mouse: its DirectInput devices become non-exclusive and
# foreground-only, and while another window is active it cannot move or confine the cursor or read the keys.
releaseInput=true
