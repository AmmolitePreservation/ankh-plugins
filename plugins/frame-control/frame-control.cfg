# frame-control settings. A setting missing here is added with its default when the game starts, and one
# this release does not use is removed and noted in the log. Delete the file to start over.

# The most frames a second the game presents while one of its windows is the active one. 0 leaves it unlimited.
foregroundFramesPerSecond=0

# The same while another application's window is the active one.
backgroundFramesPerSecond=0
