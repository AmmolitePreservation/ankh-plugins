# memory-trim settings. A setting missing here is added with its default when the game starts, and one
# this release does not use is removed and noted in the log. Delete the file to start over.

# Every this many seconds while another application's window is the active one, the game's memory in RAM is handed
# back to Windows. Windows gives back at once what the game touches again and pages out the rest when RAM runs
# short, so many games can run at once on less RAM. 0 never does it.
backgroundTrimSeconds=60

# The same while one of the game's windows is the active one.
foregroundTrimSeconds=0
