# The loader's test game (x86) for the loader as opengl32.dll: the build makes its executable, and build.ps1 -test
# runs the loader in it.
# The game's executable, relative to its install folder. The loader DLL and the ankh-plugins folder go beside it.
executable=fixtureGame.exe
# The executable's architecture, x64 or x86, which picks the build.
architecture=x86
# The system DLL the executable imports, which the loader stands in for (core/loader/proxies lists the choices).
loader=opengl32
# A second program that gets the plugins: the loader's tests run a copy of the executable under this name.
companion=fixtureCompanion.exe
