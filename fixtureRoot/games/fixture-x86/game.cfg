# The loader's test game (x86): the build makes its executable, and build.ps1 -test runs the loader in it.
# The game's executable, relative to its install folder. The loader DLL and the ankh-plugins folder go beside it.
executable=fixtureGame.exe
# The executable's architecture, x64 or x86, which picks the build.
architecture=x86
# The system DLL the executable imports, which the loader stands in for (core/loader/proxies lists the choices).
loader=version
# A second program that gets the plugins: the loader's tests run a copy of the executable under this name.
companion=fixtureCompanion.exe
# A launcher launcher-skip (msimg32.dll) starts the game in place of: the build makes it, and its test runs it.
launcher=fixtureLauncher.exe
# The build of the executable the game's handlers were written for: its timeDateStamp as the loader's log prints it at
# sessionStart. The loader stops in any other build. The fixture's build stamps its executable with this value.
timeDateStamp=0x4D2A8F16
