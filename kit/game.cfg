# Which game these plugins are in: the loader reads this file each time the game starts.
# The game's executable, by its file name. The loader DLL and the ankh-plugins folder go beside it.
executable=YourGame.exe
# The executable's architecture, x64 or x86: this download's.
architecture={architecture}
# The system DLL the executable imports, which the loader stands in for: version or opengl32. Copy that DLL from the
# download's loaders folder to beside the executable.
loader=version
# Optional, any number: another program beside the executable that also gets the plugins.
#companion=YourGameConfig.exe
# Optional: the launcher that launcher-skip (msimg32.dll, 32-bit games) starts the game in place of.
#launcher=YourGameLauncher.exe
